[enb]
enb_id = 0x19B
mcc = 901
mnc = 70
mme_addr = 127.0.0.1
gtp_bind_addr = 127.0.0.1
s1c_bind_addr = 127.0.0.1
n_prb = 50

[enb_files]
sib_config = sib.conf
rr_config = rr.conf
drb_config = drb.conf

[rf]
device_name = zmq
device_args = fail_on_disconnect=true,tx_port=tcp://*:2000,rx_port=tcp://localhost:2001,id=enb,base_srate=23.04e6

[expert]
# Mobility & Predictive Handover Configuration
enable_predictive_ho = true
predictive_lookahead_ms = 480
min_trend_samples = 3
a3_offset = 3
a3_hysteresis = 1
time_to_trigger = 320
